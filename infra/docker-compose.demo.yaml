# Variante para pruebas y debugging — NO usar para la demo frente al corrector.
#
# Se corre encadenado sobre los otros dos archivos, nunca solo:
#
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml -f docker-compose.demo.yaml up --build
#
# Expone al host los servicios y bases de datos que docker-compose.override.yaml
# cierra con `ports: !reset []`, para poder pegarles directo con curl/Postman o
# un cliente de DB mientras se debuggea un flujo puntual.
#
# Los puertos externos son distintos a los estándar (5432, 27017, etc.) para no
# chocar con una instancia de Postgres/Mongo que ya tengas corriendo localmente
# para otra cosa.

services:
  identity-service:
    ports:
      - "8081:8080"

  community-service:
    ports:
      - "8001:8000"

  chat-service:
    ports:
      - "8082:8080"

  identity-db:
    ports:
      - "5433:5432"

  community-db:
    ports:
      - "5434:5432"

  chat-mongo:
    ports:
      - "27018:27017"